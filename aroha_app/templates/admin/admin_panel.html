{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroha · Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #faf9f6;
            color: #2c352e;
            padding: 30px 50px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 500;
            color: #2b3a2d;
        }

        .brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand .role-tag {
            color: #71717a;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid #d8d2c5;
            border-radius: 12px;
            background-color: #ffffff;
            color: #2c352e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-btn:hover {
            background-color: #f3efe6;
            border-color: #b8b0a0;
        }

        /* Main Content */
        .page-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 38px;
            font-weight: 400;
            color: #2b3a2d;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 15px;
            color: #71717a;
            margin-bottom: 32px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: #e8dfd1;
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 190px;
        }

        .card-content h3 {
            font-size: 22px;
            font-weight: 600;
            color: #2b3a2d;
            margin-bottom: 8px;
        }

        .card-content p {
            font-size: 14px;
            color: #586059;
            margin-bottom: 24px;
        }

        .btn-action {
            display: inline-block;
            align-self: flex-start;
            background-color: #1e3923;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-action:hover {
            background-color: #142818;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Header -->
        <header class="header">
            <div class="brand">
                <img src="{% static 'aroha/images/aroha-logo.png' %}" alt="Aroha Logo">
                <div>Aroha <span class="role-tag">· Admin</span></div>
            </div>
            <nav class="nav-links">
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-btn">Sign out</button>
                </form>
            </nav>
        </header>

        <!-- Main Section -->
        <main>
            <h1 class="page-title">Accounts</h1>
            <p class="page-subtitle">Browse the account directories.</p>

            <!-- 3 Directories Grid -->
            <div class="cards-grid">
               
                <!-- Barangay Accounts -->
                <div class="card">
                    <div class="card-content">
                        <h3>Barangay Accounts</h3>
                        <p>Browse barangay staff accounts.</p>
                    </div>
                    <a href="{% url 'admin_user_list' 'staff' %}" class="btn-action">View accounts</a>
                </div>

                <!-- Volunteer Accounts -->
                <div class="card">
                    <div class="card-content">
                        <h3>Volunteer Accounts</h3>
                        <p>Browse volunteer accounts.</p>
                    </div>
                    <a href="{% url 'admin_user_list' 'volunteer' %}" class="btn-action">View accounts</a>
                </div>

                <!-- Family Member Accounts -->
                <div class="card">
                    <div class="card-content">
                        <h3>Requester Accounts</h3>
                        <p>Browse requester accounts.</p>
                    </div>
                    <a href="{% url 'admin_user_list' 'requester' %}" class="btn-action">View accounts</a>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
