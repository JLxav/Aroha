<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aroha{% endblock %}</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 20px; line-height: 1.5;
           background: #f4f7fb; color: #1a1a1a; margin: 0; }
    .card { max-width: 480px; margin: 40px auto; background: #fff; padding: 32px;
            border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    h1 { margin-top: 0; color: #0b4f8a; }
    label { display: block; font-weight: bold; margin-top: 16px; }
    input, select { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px;
                    margin-top: 6px; border: 2px solid #555; border-radius: 8px; }
    button { width: 100%; margin-top: 24px; padding: 14px; font-size: 22px; font-weight: bold;
             background: #0b4f8a; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #083a66; }
    .errorlist { color: #b00020; padding-left: 20px; margin: 6px 0 0; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: #dff3e4; }
    .message.error { background: #fde2e2; }
    a { color: #0b4f8a; }
  </style>
</head>
<body>
  <div class="card">
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
