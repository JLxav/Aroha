{% extends "base.html" %}
{% block title %}Log in - Aroha{% endblock %}

{% block content %}
  <h1>Log in to Aroha</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
